# config options for the idealized Great Lakes initial condition, built on
# the combined mesh from polaris.tasks.ocean.great_lakes.combine

# Options related to the ocean component
[ocean]

# Equation of state type. TEOS-10 is required here, not a simplification:
# a linear EOS has no pressure dependence, so it cannot represent either
# the thermobaric effect (pressure's influence on the thermal expansion
# coefficient, significant over Superior's ~400 m water column) or the 4
# degC freshwater density maximum that governs Great Lakes stratification
# and seasonal overturn. Both come from the full IAPWS-95 pure-water
# formulation TEOS-10 is built on, exercised here near its pure-water
# (near-zero salinity) limit for the first time in this codebase; see
# docs/design_docs/great_lakes_mesh.md. Forward.__init__ below passes
# update_eos=True precisely so this option also governs the model's
# runtime EosType/config_eos_type, not just how this initial condition's
# tracers are written.
eos_type = teos-10

[vertical_grid]

# a tanh profile keeps the surface well resolved without needing as many
# levels as a uniform grid would at Superior's ~400 m depth. min/max
# layer thickness and vert_levels below are chosen so that thickness
# grows by no more than ~13% between adjacent layers (versus up to a
# ~2.7x jump between layers 1-2 and 2-3 with the previous 30/1.5/15.0
# combination), so the near-surface thermocline (thermocline_depth =
# 15.0, thermocline_width = 5.0 below) isn't sitting inside layers that
# are already 10+ m thick. With these values, layer thickness stays
# under ~2 m down to ~10 m depth, ~2.7 m at the 15 m thermocline center,
# and ~7 m by 50 m depth, versus 15 m by 50 m depth with the previous
# grid (where only 5 of 30 levels had their bottom shallower than 50 m,
# versus 16 of 40 here).
grid_type = tanh_dz

# kept in the 30-40 range (rather than, e.g., 50, which would resolve
# the thermocline band more finely still, down to ~5 m layers by 50 m
# depth) to limit the increase in column count to ~33% over the
# previous 30
vert_levels = 40

# exceeds Superior's true ~401-406 m max depth (the deepest of the four
# basins) with margin -- recheck against the merged mesh's own deepest
# cell if the bathymetry pipeline changes
bottom_depth = 420.0

min_layer_thickness = 1.0
max_layer_thickness = 20.0
coord_type = z-star
partial_cell_type = partial
min_pc_fraction = 0.1

# 3 levels x 1.0 m minimum thickness = 3.0 m, which is why
# [great_lakes_init] min_bottom_depth below is 5.0: comfortably above
# the depth a cell needs to carry this many levels at all. Replaying
# compute_min_max_level_cell (polaris.ocean.vertical.zlevel) and
# alter_bottom_depth (polaris.ocean.vertical.partial_cells) against
# this 1D grid at bottomDepth = min_bottom_depth = 5.0 m gives 5 valid
# levels, not just the 3 required -- a wider margin than the previous
# grid's 2-level shortfall documented below.
min_vert_levels = 3

[great_lakes_init]

# positive-down depth, m, that bottomDepth is clamped to -- both for cells
# shallower than this in the remapped bathymetry and for the small number
# of cells with a fill-value/NaN elevation (81 of 90,998 cells in the
# basins checked so far, under the vertical grid as it stood before the
# vert_levels/min_layer_thickness/max_layer_thickness change above; recheck
# if the bathymetry pipeline changes). Sized to the vertical grid's own
# floor (min_vert_levels * min_layer_thickness = 3.0 m above) rather than
# deeper, since a deeper floor only enlarges the shoreline artifact this
# clamp introduces without buying anything init_vertical_coord needs. See
# docs/design_docs/great_lakes_mesh.md for the cell-count tradeoff at
# other floors.
#
# Note this does not guarantee every clamped cell keeps all 3 levels:
# partial_cell_type = partial below can trim maxLevelCell further if the
# bottom-most layer's fraction falls under min_pc_fraction, after
# min_vert_levels has already been enforced. Under the previous 30-level,
# 1.5/15.0 m grid, 12,181 of 90,998 cells (13.4%) ended up with 2 valid
# levels instead of 3 this way; none ended up with fewer than 2 or with
# zero. The vert_levels/min_layer_thickness/max_layer_thickness change
# above leaves 5 valid levels at this floor rather than 3 (see the
# min_vert_levels comment), which should substantially shrink or
# eliminate that shortfall, but this has not yet been remeasured against
# the real merged mesh -- do so (and update this comment and
# docs/design_docs/great_lakes_mesh.md) the next time the init step is
# run end-to-end.
min_bottom_depth = 5.0

# idealized summer-stratified rest state: uniform near-surface
# temperature, a tanh thermocline, and a cold, well-mixed bottom layer.
# No Great Lakes temperature/salinity climatology was available to build
# toward instead; see docs/design_docs/great_lakes_mesh.md.
surface_temperature = 20.0
bottom_temperature = 4.0

# positive-down depth, m, of the thermocline's center
thermocline_depth = 15.0

# e-folding-like width, m, of the tanh thermocline transition
thermocline_width = 5.0

# practical/absolute salinity, g/kg, one representative value per basin
# (uniform with depth and within each basin) -- reported values for each
# lake, each near-zero since the Great Lakes are freshwater but not
# identical since Superior is markedly less mineralized than the lower
# lakes. Keyed by the basin names in
# polaris.tasks.ocean.great_lakes.lakes.GREAT_LAKES.
salinity_superior = 0.05
salinity_michigan_huron = 0.1
salinity_erie = 0.2
salinity_ontario = 0.2
