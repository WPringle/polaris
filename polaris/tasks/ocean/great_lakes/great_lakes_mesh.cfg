# config options for building a JIGSAW mesh for a single Great Lake
[great_lakes_mesh]

# cell width at the shoreline, km. 0.8125 = max_resolution_km / 4, and is
# close to 3x the ~270 m pixel spacing of the coarsened bathymetry used
# for the final remap (coarsen_factor = 3 applied to the ~90 m native
# DEM), so the remap source stays several times finer than this target.
coastal_resolution_km = 0.8125

# cap / background cell width within the lake's own region, km. This is
# also the land-side background used by the coastal transition, so that
# land cells near the shore get refined too (for a clean post-cull
# coastline) without needing a separate land-background option.
max_resolution_km = 3.25

# distance, km, over which cell width ramps from coastal_resolution_km to
# max_resolution_km, applied symmetrically on both sides of the
# bathymetry-derived shoreline
coastal_transition_km = 10.0

# exponent of the coastal transition blend; 1.0 is a linear ramp
coastal_transition_exponent = 1.0

# cell width, km, imposed far from the lake to keep JIGSAW tractable even
# though it technically meshes the whole globe
background_width_km = 100.0

# buffer, degrees, added around the lake's own bathymetry extent before
# cell width is allowed to relax toward background_width_km. Must be large
# enough (in km) to comfortably exceed coastal_transition_km, or the
# background relaxation will encroach on near-shore cells.
region_buffer_deg = 0.5

# distance, km, over which cell width relaxes from max_resolution_km to
# background_width_km outside the buffered region
background_transition_km = 200.0

# resolution, km, applied wherever the bathymetric slope exceeds
# slope_threshold_high -- e.g. steep, narrow trench walls far from shore
# that the coastal-distance-based refinement above never reaches, and
# that offshore cells at max_resolution_km would otherwise smooth flat.
# Matches coastal_resolution_km by default (see that option's comment for
# why 0.8125), treating steep offshore features as finely as the coast
# itself.
slope_resolution_km = 0.8125

# bathymetric slope (dimensionless: m of depth change per m of horizontal
# distance) below which no slope-based refinement is applied. Lake Erie
# and Lake Superior's native DEMs have a median water-cell slope around
# 0.006-0.03 and a 90th percentile around 0.03-0.06, so 0.02 targets only
# distinctly steep terrain, not ordinary basin-floor roughness.
slope_threshold_low = 0.02

# bathymetric slope above which slope_resolution_km fully applies. 0.1 is
# roughly the 99th percentile of water-cell slope in the lakes checked so
# far, i.e. only the steepest ~1% of the bathymetry is targeted.
slope_threshold_high = 0.1

# exponent of the slope-based blend; 1.0 is a linear ramp
slope_transition_exponent = 1.0

# radius, km, of the morphological closing applied to the steep
# (slope >= slope_threshold_high) mask, so that low-slope trough floors
# fully enclosed by steep walls are refined to slope_resolution_km too,
# even though their own local slope never crosses slope_threshold_high.
# Unlike dilating outward from every steep cell (which would also expand
# refinement along ordinary, unenclosed steep terrain such as shoreline
# drop-offs), closing only fills pockets that are actually enclosed.
# Calibrated against Lake Superior's southeast trough, whose steep "wall"
# has small gaps that need about 1.85 km of closing to fully enclose the
# floor; lake-wide this adds about 1% more refined area than the slope
# ramp alone.
slope_fill_radius_km = 2.0

# resolution, km, applied wherever the topographic length scale (see
# length_scale_threshold_high_km below) drops to length_scale_threshold_low_km
# or less. Matches coastal_resolution_km/slope_resolution_km by default.
length_scale_resolution_km = 0.8125

# the topographic length scale L = he / |grad(H)| is a scale-aware
# alternative to a raw slope threshold: he = h1*h2/(h1+h2) is the
# harmonic-mean-like "effective depth" between two neighboring native-grid
# depths h1, h2 (the same combination that sets the two-layer internal
# wave speed c = sqrt(g' * he) in gravity-current/exchange-flow theory,
# e.g. strait sill flows), and L has units of length: how far, at the
# local depth gradient, depth would need to change by its own effective
# scale. Unlike slope_threshold_high above, L responds to *relative*
# depth change, so one shared threshold works across lakes with very
# different native steepness (e.g. Lake Michigan-Huron's native DEM is
# roughly half as steep as Lake Superior's at every percentile) without
# per-lake tuning -- confirmed by checking all four lakes' native DEMs
# directly: this shared L threshold gives similar, modest cost increases
# for every lake (roughly 10-30%), while slope_threshold_high alone
# requires per-lake values to avoid either missing real Michigan-Huron
# troughs or drastically over-refining Lake Superior.
#
# L is only evaluated outside the coastal-transition buffer (see
# coastal_transition_km above): he collapses toward zero in shallow water
# near any shoreline regardless of how gentle the slope actually is
# there, which would otherwise make L spuriously small along most of the
# coastline -- a problem the coastal-distance ramp above already handles
# on its own.
#
# length_scale_threshold_low_km: L at/below which length_scale_resolution_km
# fully applies.
length_scale_threshold_low_km = 1.5

# L at/above which no length-scale-based refinement is applied
length_scale_threshold_high_km = 4.0

# exponent of the length-scale blend; 1.0 is a linear ramp
length_scale_transition_exponent = 1.0

# radius, km, of the morphological closing applied to the short
# (L <= length_scale_threshold_low_km) mask, analogous to
# slope_fill_radius_km above, so that long-length-scale (flat) trough
# floors fully enclosed by short-length-scale walls are refined too.
# Calibrated against all four lakes' known troughs directly; their walls
# have bigger gaps than Lake Superior's own trough (see
# slope_fill_radius_km above), hence the larger default here.
length_scale_fill_radius_km = 3.0

# resolution, degrees, of the fine part of the graded JIGSAW sizing grid
# (the lake's own bounding box plus region_buffer_deg). Should resolve
# coastal_transition_km and need not be finer than the bathymetry's own
# native pixel spacing.
fine_grid_resolution_deg = 0.0025

# resolution, degrees, of the coarse far-field part of the graded grid
coarse_grid_resolution_deg = 1.0

# per-step growth factor used to taper grid spacing between the fine
# region and the coarse far field
grid_growth_factor = 1.15
