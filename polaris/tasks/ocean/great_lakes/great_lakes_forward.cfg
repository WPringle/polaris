# config options for the Great Lakes combined-mesh forward smoke test
[great_lakes_forward]

# approximate number of cells in the combined mesh, used only to size the
# number of MPI tasks (goal_cells_per_core in the shared [ocean] section).
# This is a fixed, known mesh (not a family of resolutions, unlike most
# other forward steps' compute_cell_count()), so this is a plain number
# rather than a formula -- update it if the four basins' meshes are
# rebuilt and their combined cell count changes (see the table in
# docs/design_docs/great_lakes_mesh.md). Measured at 89,691 after
# Michigan-Huron's bathymetry was also clipped near the Soo Locks, to
# remove an area that physically overlapped Lake Superior's own clipped
# domain there (see "Decision: Lake Huron's domain stops short of the
# Soo Locks too"; 330 fewer cells than the 90,021 before that fix).
# dcEdge_min shifted from Lake Ontario (551.6 m) to Lake Michigan-Huron
# (498.1 m, at the new clip boundary); see the btr_dt comment below.
approx_cell_count = 89691

# barotropic (external-gravity-wave) time step, s. Must stay below the
# worst-edge CFL limit dcEdge_min / sqrt(g * bottom_depth): the combined
# mesh's finest edge (498.1 m, now Lake Michigan-Huron rather than Lake
# Ontario's previous 551.6 m) and the vertical grid's bottom_depth
# (420.0 m) give sqrt(g*bottom_depth) = 64.2 m/s and a ~7.8 s limit.
# 4.0 s leaves a 0.485 safety factor -- looser than an
# earlier 3.0 s/0.349 choice, picked with margin to spare for this
# mesh/model pairing's first actual forward run rather than pushed to the
# limit; see docs/design_docs/great_lakes_mesh.md. Recompute if the mesh
# or bottom_depth change.
btr_dt = 4.0

# ratio of the main (baroclinic) time step to btr_dt, giving a 180 s
# baroclinic step. This is looser than the EC30to60E2r2 registered mesh's
# own 24 (originally copied here unchanged); at 180 s, margin against the
# baroclinic CFL (dcEdge_min / (c + u)) ranges from ~10x at an assumed
# 0.3 m/s flow speed down to ~3x at a conservative 1.0 m/s, and ~21x
# against the del2 diffusive stability bound below -- see
# docs/design_docs/great_lakes_mesh.md for the derivation.
dt_btr_ratio = 45

# Laplacian horizontal viscosity, m^2/s. Its stability bound,
# dcEdge_min^2 / (4 * del2), must exceed the main time step (dt_btr_ratio *
# btr_dt); at the values above that bound is ~3100 s against a 72 s time
# step, leaving ample margin. Omega's global-mesh default (1.0e3) is
# unconditionally unstable at this resolution (a ~62 s bound), so this
# must not be left at the model default.
del2 = 20.0

# Biharmonic horizontal viscosity, m^4/s, chosen for roughly a 1-day
# damping time at the grid scale. Omega's global-mesh default (1.2e11) is
# several orders of magnitude too large here.
del4 = 1.0e6

# whether to disable the del4 (biharmonic) term entirely and rely on del2
# alone, as a fallback if it looks noisy or unstable
disable_del4 = false

# implicit bottom drag coefficient (dimensionless)
bottom_drag_coeff = 1.0e-3

# length of the smoke-test run
run_duration_hours = 6

# how often output is written
output_interval_hours = 1
