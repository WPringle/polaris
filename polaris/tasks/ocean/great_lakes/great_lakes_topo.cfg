# config options for preparing and remapping a single Great Lake basin's
# bathymetry
[great_lakes_topo]

# path(s) to the basin's bathymetry file(s), comma- or whitespace-
# separated: each a lon/lat-gridded NetCDF (COARDS/CF conventions),
# optionally gzip-compressed (a plain ".gz" suffix is detected and
# decompressed automatically). Set this to the local path of your
# downloaded file(s), e.g. NOAA's Great Lakes bathymetry DEM
# (<lake>_lld.grd.gz). Most basins need only one file; michigan_huron
# needs both michigan_lld.grd.gz and huron_lld.grd.gz, which are merged
# onto one grid (they tile together exactly at the Straits of Mackinac).
bathymetry_filenames = <<<missing>>>

# longitude, degrees, east of which native bathymetry is discarded before
# meshing (keeps lon <= lon_max_deg). Blank means no clipping. See
# docs/design_docs/great_lakes_mesh.md for why Lake Superior sets this.
lon_max_deg =

# excludes a rectangular corner of the basin's bathymetry: source pixels
# with longitude < exclude_lon_max_deg AND latitude > exclude_lat_min_deg
# are set to land (NaN). Unlike lon_max_deg (which clips the whole grid
# at one longitude across every latitude), this only removes a corner, so
# it can isolate a connecting-channel approach that doesn't span the
# basin's full latitude range. Both must be set together; blank means no
# exclusion. See docs/design_docs/great_lakes_mesh.md for why
# michigan_huron sets this.
exclude_lon_max_deg =
exclude_lat_min_deg =

# name of the elevation variable in the source file, positive up, in
# meters, referenced to the lake's own local water-level datum (i.e.
# negative values are lake-bottom depth below the lake surface, positive
# values are land above it -- NOAA's "lld" Great Lakes grids are already
# in this convention)
elevation_var = z

# name of the longitude and latitude variables/dimensions in the source
# file
lon_var = x
lat_var = y

# minimum ocean fraction of a remapped MPAS cell below which it is culled
min_ocean_fraction = 0.5

# factor by which the native-resolution bathymetry is block-averaged
# before the conservative remap (the mesh step's cell-width shaping and
# the cull step's wet-mask classification both use the native-resolution
# file directly and are unaffected). The remap's cost scales with source
# point count, so this should keep the source several times finer than
# coastal_resolution_km while cutting a possibly tens-of-millions-of-point
# native DEM down to something tractable. 3 takes NOAA's 3 arc-second
# (~90 m) Great Lakes grids to ~270 m, still well finer than the 925 m
# coastal target. Set to 1 to disable and remap at native resolution.
coarsen_factor = 3

# how often, in seconds, the remap steps log a liveness heartbeat while
# mbtempest is computing weights (it reports no completion fraction, so
# this is only evidence the step hasn't hung, not a progress estimate)
remap_progress_interval_s = 60
